---
layout: home
author_profile: true
---

<section class="home-hero">
  <p class="home-hero__prompt">$ whoami</p>
  <h1 class="home-hero__title">{{ site.subtitle }}</h1>
  <p class="home-hero__desc">{{ site.description }}</p>

  {% assign cats = site.categories | sort %}
  {% if cats.size > 0 %}
  <ul class="home-cats">
    {% for cat in cats %}
    <li>
      <a href="{{ '/categories/' | relative_url }}#{{ cat[0] | slugify }}">
        {{ cat[0] }} <span>{{ cat[1].size }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</section>
