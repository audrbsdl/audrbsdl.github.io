# 사이트 전역 설정
# 수정 후 로컬에서는 `bundle exec jekyll serve`를 재시작해야 반영됩니다.

# ── 사이트 정보 ───────────────────────────────────────────
locale: "ko-KR"
title: "audrbsdl.log"           # TODO: 원하는 블로그 이름으로 바꾸세요
title_separator: "·"
subtitle: "배우고, 만들고, 기록합니다"
name: "audrbsdl"
description: >-
  배우고 만든 것들을 주제별로 정리해 두는 개인 기술 블로그입니다.
url: "https://audrbsdl.github.io"
baseurl: ""
repository: "audrbsdl/audrbsdl.github.io"
github_username: audrbsdl
minimal_mistakes_skin: dark      # 기본 다크 스킨 위에 assets/css/main.scss로 덮어씁니다
search: true
search_full_content: true

# ── 빌드 ─────────────────────────────────────────────────
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
paginate: 8
paginate_path: /page:num/
timezone: Asia/Seoul

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

include:
  - _pages

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# ── 작성자 (사이드바) ────────────────────────────────────
author:
  name   : "audrbsdl"
  # avatar : "/assets/images/avatar.png"   # 내 사진/아이콘을 넣고 주석을 푸세요
  bio    : "배운 것을 기록하는 블로그"       # TODO: 한두 줄 소개
  location: "Seoul, Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/audrbsdl"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/audrbsdl"
    - label: "RSS"
      icon: "fas fa-fw fa-rss"
      url: "/feed.xml"

# ── 기본값 ───────────────────────────────────────────────
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      words_per_minute: 400       # 한글 기준으로 읽기 시간 보정
      show_date: true
      toc: true
      toc_sticky: true
      toc_label: "목차"
      share: false
      related: true
      comments: false
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

date_format: "%Y.%m.%d"

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
